global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # `arb record` serves /metrics on :9000.
  - job_name: arb
    static_configs:
      - targets: ["app:9000"]

  # `arb ui` serves /metrics on its own HTTP port.
  - job_name: arb-ui
    static_configs:
      - targets: ["app:8080"]
