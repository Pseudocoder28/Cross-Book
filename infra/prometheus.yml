global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # `arb ui` serves /metrics on its own HTTP port. It is the only arb target:
  # nothing binds :9000 any more (the standalone recorder command is gone).
  - job_name: arb-ui
    static_configs:
      - targets: ["app:8080"]
