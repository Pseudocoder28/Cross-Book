# Grafana dashboard provisioning. Dashboards are JSON files in this directory
# (mounted read-only from ./infra/grafana/provisioning by docker-compose.yml).
# Edit the JSON here, not in the Grafana UI: allowUiUpdates is off so the file
# stays the source of truth.

apiVersion: 1

providers:
  - name: arb
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
